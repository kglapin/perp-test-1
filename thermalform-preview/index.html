<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThermalForm preview</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f3ed;color:#111712}.loading{min-height:100vh;display:grid;place-items:center;font-size:14px}</style></head><body><div class="loading">Loading preview…</div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4,5,6].map(async i=>{const r=await fetch(`chunk-${i}.txt`);if(!r.ok)throw new Error(`chunk ${i}: ${r.status}`);return r.text()}));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div class="loading">Preview error: ${String(e)}</div>`}})();</script></body></html>
